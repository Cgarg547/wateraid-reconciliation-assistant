services:
  - type: web
    name: wateraid-reconciliation-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: reconciliation-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_PATH
        value: /var/data/reconciliation.db
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
